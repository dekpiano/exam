version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam_app
    restart: always
    ports:
      - "8200:443" # https://localhost:8200
    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
    environment:
      - CI_ENVIRONMENT=development
    networks:
      - skj2025_default

networks:
  skj2025_default:
    external: true
